name: CumpleFactura - UI y núcleo nativo

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: UI, contrato y navegador
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CHROMEDRIVER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run validate:ui-contract
      - run: npm run validate:secret-scan
      - run: node tools/verify-refactor-contract.mjs
      - run: node --experimental-strip-types --test tests/ui/routes.test.mjs
      - run: npm run validate:browser-smoke
      - name: Revisar las nueve áreas en claro y oscuro
        run: node tools/verify-phase1-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-browser-evidence
          path: |
            docs/phase1/browser-results.json
            docs/phase1/screenshots/
            tests/regulatory/evidence/latest-browser-smoke.*

  native-windows:
    name: Rust, SQLite y XSD (Windows)
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CHROMEDRIVER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: rustup default stable
      - run: rustup component add rustfmt
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --all --check
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
      - run: npm run validate:verifactu:xsd
      - run: npm run validate:core-e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-native-core-evidence
          path: tests/regulatory/evidence/latest-core-e2e*

# Estos jobs no sustituyen validate:regulatory ni el E2E de la ventana Tauri.
# El gate completo conserva sus fuentes normativas y prerrequisitos externos.
